name: AutoBench CI

on:
  push:
    branches:
      - main
      - "plan/**"
      - "feat/**"
  pull_request:

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Geometry tests
        run: npm test

      - name: Next build
        run: npm run build
