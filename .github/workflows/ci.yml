name: AutoBench CI

on:
  push:
    branches:
      - main
      - "plan/**"
      - "feat/**"
  pull_request:

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: npm ci

      - name: Geometry tests
        run: npm test

      - name: Exact CAD kernel smoke test
        run: |
          mkdir -p artifacts
          npx brep cad/m0-frame-rail.brep.ts --check --step artifacts/m0-frame-rail.step --json artifacts/m0-frame-rail.report.json

      - name: Exact Pops Van scenario verification
        run: node scripts/m0-exact-pops.mjs

      - name: Replicad full Pops bake-off
        run: node scripts/m0-replicad-pops.mjs

      - name: brepjs full Pops bake-off
        run: node scripts/m0-brepjs-pops.mjs

      - name: Shared OCCT + brepjs kernel architecture smoke
        run: node scripts/m0-shared-kernel-smoke.mjs

      - name: Upload exact CAD artifacts
        uses: actions/upload-artifact@v4
        with:
          name: m0-exact-cad-artifacts
          path: |
            artifacts/
            package-lock.json
          if-no-files-found: error

      - name: Next build
        run: npm run build

      - name: Install browser smoke dependency
        run: npx playwright install --with-deps chromium

      - name: Browser exact-kernel smoke
        run: |
          npm start > /tmp/autobench-next.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000 > /dev/null; then
              break
            fi
            sleep 1
          done

          npm run smoke:browser
          node scripts/bakeoff-browser-smoke.mjs
