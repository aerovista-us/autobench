name: AutoBench CI

on:
  push:
    branches:
      - main
      - "plan/**"
      - "feat/**"
  pull_request:

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: npm install

      - name: Geometry tests
        run: npm test

      - name: Exact CAD kernel smoke test
        run: |
          mkdir -p artifacts
          npx brep cad/m0-frame-rail.brep.ts --check --step artifacts/m0-frame-rail.step --json artifacts/m0-frame-rail.report.json

      - name: Upload exact CAD artifacts
        uses: actions/upload-artifact@v4
        with:
          name: m0-exact-cad-artifacts
          path: artifacts/
          if-no-files-found: error

      - name: Next build
        run: npm run build
