name: AutoBench CI

on:
  push:
    branches:
      - main
      - "plan/**"
      - "feat/**"
  pull_request:

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: npm ci

      - name: Production dependency audit report
        run: |
          mkdir -p artifacts
          npm audit --omit=dev --json > artifacts/npm-audit-production.json || true
          node scripts/m0-audit-summary.mjs

      - name: Geometry tests
        run: npm test

      - name: Exact CAD kernel smoke test
        run: |
          mkdir -p artifacts
          npx brep cad/m0-frame-rail.brep.ts --check --step artifacts/m0-frame-rail.step --json artifacts/m0-frame-rail.report.json

      - name: Exact Pops Van scenario verification
        run: node scripts/m0-exact-pops.mjs

      - name: Exact G10 front-clip CAD across five axle scenarios
        run: node scripts/m2-front-clip-exact.mjs

      - name: M3 body and aftermarket-style CAD package validation
        run: node scripts/m3-upgrade-cad-smoke.mjs

      - name: M4 van identity and exterior feature CAD validation
        run: node scripts/m4-van-identity-cad-smoke.mjs

      - name: Replicad full Pops bake-off
        run: node scripts/m0-replicad-pops.mjs

      - name: brepjs full Pops bake-off
        run: node scripts/m0-brepjs-pops.mjs

      - name: Shared OCCT + brepjs kernel architecture smoke
        run: node scripts/m0-shared-kernel-smoke.mjs

      - name: Upload exact CAD artifacts
        uses: actions/upload-artifact@v4
        with:
          name: m0-exact-cad-artifacts
          path: |
            artifacts/
            package-lock.json
          if-no-files-found: error

      - name: Next build
        run: npm run build

      - name: Runtime and bundle footprint
        run: node scripts/m0-runtime-footprint.mjs

      - name: Upload final runtime reports
        uses: actions/upload-artifact@v4
        with:
          name: m0-runtime-reports
          path: |
            artifacts/m0-runtime-footprint.json
            artifacts/npm-audit-production.json
          if-no-files-found: error

      - name: Install browser smoke dependency
        run: npx playwright install --with-deps chromium

      - name: Browser exact-kernel smoke
        run: |
          npm start > /tmp/autobench-next.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000 > /dev/null; then
              break
            fi
            sleep 1
          done

          npm run smoke:browser
          node scripts/m1-research-isolation-smoke.mjs
          node scripts/m1-capture-browser-smoke.mjs
          node scripts/m1-photo-browser-smoke.mjs
          node scripts/m1-visual-reference-browser-smoke.mjs
          node scripts/m2-front-clip-browser-smoke.mjs
          node scripts/m3-upgrades-browser-smoke.mjs
          node scripts/m4-van-identity-browser-smoke.mjs

      - name: Upload M1 photo calibration browser proof
        uses: actions/upload-artifact@v4
        with:
          name: m1-photo-calibration-browser
          path: artifacts/m1-photo-calibration.png
          if-no-files-found: error

      - name: Upload M2 front-clip browser proof
        uses: actions/upload-artifact@v4
        with:
          name: m2-g10-front-clip-browser
          path: |
            artifacts/m2-g10-front-clip.png
            artifacts/m2-g10-front-clip-mobile.png
          if-no-files-found: error

      - name: Upload M3 aftermarket concepts browser proof
        uses: actions/upload-artifact@v4
        with:
          name: m3-body-bumper-suspension-browser
          path: |
            artifacts/m3-steel-bumper-contoured-body.png
            artifacts/m3-winch-reservoir-leaf-inspection.png
            artifacts/m3-brush-guard-body-size.png
            artifacts/m3-mobile-upgrades.png
          if-no-files-found: error

      - name: Upload M4 van identity browser proof
        uses: actions/upload-artifact@v4
        with:
          name: m4-van-identity-exterior-browser
          path: |
            artifacts/m4-classic-van-front.png
            artifacts/m4-classic-van-side.png
            artifacts/m4-classic-van-rear.png
            artifacts/m4-camper-portholes-rack.png
            artifacts/m4-expedition-spare-rack.png
            artifacts/m4-custom-top.png
            artifacts/m4-mobile-expedition.png
          if-no-files-found: error
